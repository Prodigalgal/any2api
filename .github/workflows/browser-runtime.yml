name: Build browser runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: any2api-browser-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-browser-runtime:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./automation
          file: ./automation/Dockerfile.browser-runtime
          push: true
          platforms: linux/arm64
          tags: docker.io/speedproxy/any2api:browser-runtime-sha-${{ github.sha }}
          cache-from: type=gha,scope=browser-runtime
          cache-to: type=gha,mode=max,scope=browser-runtime
          provenance: mode=max
          sbom: true
