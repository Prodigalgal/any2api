name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Update the GitOps repository after publishing images
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: any2api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Test backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

  automation-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
      - name: Test automation
        working-directory: automation
        run: |
          uv sync --frozen
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test web
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

  build-images:
    if: github.event_name != 'pull_request'
    needs: [backend-quality, automation-quality, web-quality]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: backend
          - component: automation
            context: automation
          - component: web
            context: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          platforms: linux/arm64
          tags: docker.io/speedproxy/any2api:${{ matrix.component }}-sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=min,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

  update-gitops:
    if: github.event_name == 'push' || inputs.deploy
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitOps deploy key
        env:
          DEPLOY_KEY: ${{ secrets.ANY2API_GITOPS_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Update immutable image tags
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          git clone git@github.com:Prodigalgal/ircs-prod-config.git gitops
          cd gitops
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("any2api/oracle/kustomization.yaml")
          content = path.read_text(encoding="utf-8")
          sha = os.environ["IMAGE_SHA"]
          for component in ("server", "automation", "web"):
              pattern = rf"(name: any2api-{component}\n\s+newName: .*\n\s+newTag: ).*"
              content, count = re.subn(pattern, rf"\g<1>{component}-sha-{sha}", content)
              if count != 1:
                  raise SystemExit(f"expected one image entry for {component}, found {count}")
          path.write_text(content, encoding="utf-8")
          PY
          git config user.name any2api-ci
          git config user.email any2api-ci@users.noreply.github.com
          git add any2api/oracle/kustomization.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deploy(any2api): ${IMAGE_SHA}"
          git push origin main
