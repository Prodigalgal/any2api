name: Build browser runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: any2api-browser-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-browser-runtime:
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      deploy: false
      browser_runtime: true
    secrets: inherit
