apiVersion: v1
kind: Service
metadata:
  name: any2api-automation-deepseek
  namespace: any2api
  labels:
    app.kubernetes.io/name: any2api-automation-deepseek
    app.kubernetes.io/part-of: any2api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8090
    targetPort: 8090
    protocol: TCP
  selector:
    app.kubernetes.io/name: any2api-automation-deepseek
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: any2api-automation-deepseek
  namespace: any2api
  labels:
    app.kubernetes.io/name: any2api-automation-deepseek
    app.kubernetes.io/part-of: any2api
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: any2api-automation-deepseek
  template:
    metadata:
      labels:
        app.kubernetes.io/name: any2api-automation-deepseek
        app.kubernetes.io/part-of: any2api
    spec:
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: any2api-dockerhub
      nodeSelector:
        infra.mnnu/node-class: core-public
      restartPolicy: Always
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      containers:
      - name: automation-deepseek
        image: docker.io/speedproxy/any2api:automation-20261014-v1.2.0-release-ffdcb59b0a18d518b283cb7c527ae2cd853c1fbf
        imagePullPolicy: IfNotPresent
        env:
        - name: ANY2API_AUTOMATION_ENABLED_PROVIDERS
          value: deepseek
        - name: ANY2API_AUTOMATION_SERVICE_NAME
          value: any2api-automation-deepseek
        envFrom:
        - configMapRef:
            name: any2api-env
        - secretRef:
            name: any2api-secrets
        ports:
        - name: http
          containerPort: 8090
          protocol: TCP
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
            ephemeral-storage: 512Mi
          limits:
            cpu: "2"
            memory: 3584Mi
            ephemeral-storage: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health/live
            port: http
            scheme: HTTP
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
            scheme: HTTP
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: runtime
          mountPath: /tmp/any2api
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: runtime
        emptyDir:
          sizeLimit: 1Gi
