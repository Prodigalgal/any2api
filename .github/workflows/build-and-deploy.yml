name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "tasks/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: Update the GitOps repository after publishing images
        required: false
        default: false
        type: boolean
      browser_runtime:
        description: Publish only the immutable browser runtime base image
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: any2api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      image_suffix: ${{ steps.release.outputs.image_suffix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate immutable release identity
        id: release
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          version = json.loads(Path("web/package.json").read_text())["version"]
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d")
          suffix = f"{date}-v{version}-release-{os.environ['IMAGE_SHA']}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\nimage_suffix={suffix}\n")
          PY

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Test backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

  automation-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
      - name: Test automation
        working-directory: automation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv sync --frozen
          uv run python ../tools/compatibility/check_versions.py
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test web
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

  build-browser-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.browser_runtime
    needs: [backend-quality, automation-quality, web-quality, release-metadata]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./automation
          file: ./automation/Dockerfile.browser-runtime
          push: true
          platforms: linux/arm64
          tags: docker.io/speedproxy/any2api:browser-runtime-${{ needs.release-metadata.outputs.image_suffix }}
          cache-from: type=gha,scope=browser-runtime
          cache-to: type=gha,mode=max,scope=browser-runtime
          provenance: mode=max
          sbom: true

  build-images:
    if: github.event_name != 'pull_request' && !inputs.browser_runtime
    needs: [backend-quality, automation-quality, web-quality, release-metadata]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: backend
            file: backend/Dockerfile
          - component: automation
            context: automation
            file: automation/Dockerfile
          - component: automation-arena
            context: automation
            file: automation/Dockerfile.arena
          - component: web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.file }}
          push: true
          platforms: linux/arm64
          tags: docker.io/speedproxy/any2api:${{ matrix.component }}-${{ needs.release-metadata.outputs.image_suffix }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=min,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

  update-gitops:
    if: github.event_name == 'push' || inputs.deploy
    needs: [build-images, release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitOps deploy key
        env:
          DEPLOY_KEY: ${{ secrets.ANY2API_GITOPS_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Update immutable image tags, namespace and server placement
        env:
          IMAGE_SUFFIX: ${{ needs.release-metadata.outputs.image_suffix }}
        run: |
          git clone git@github.com:Prodigalgal/ircs-prod-config.git gitops
          cd gitops
          python3 - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          path = Path("any2api/oracle/kustomization.yaml")
          content = path.read_text(encoding="utf-8")
          namespace = re.search(r"^namespace:\s*(\S+)\s*$", content, re.MULTILINE)
          if namespace is not None and namespace.group(1) != "any2api":
              raise SystemExit("unexpected Any2API GitOps namespace")
          if namespace is None:
              content, count = re.subn(r"^kind: Kustomization$",
                  "kind: Kustomization\nnamespace: any2api", content, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit("expected one GitOps Kustomization")
          suffix = os.environ["IMAGE_SUFFIX"]
          for component in ("server", "automation", "automation-arena", "web"):
              pattern = rf"(name: any2api-{component}\n\s+newName: .*\n\s+newTag: ).*"
              content, count = re.subn(pattern, rf"\g<1>{component}-{suffix}", content)
              if count != 1:
                  raise SystemExit(f"expected one image entry for {component}, found {count}")
          patch_name = "server-database-affinity.yaml"
          patch_source = Path(os.environ["GITHUB_WORKSPACE"]) / "deploy/gitops" / patch_name
          shutil.copyfile(patch_source, path.parent / patch_name)
          if patch_name not in content:
              if re.search(r"^patches:\s*$", content, re.MULTILINE):
                  content = re.sub(r"^patches:\s*$", f"patches:\n  - path: {patch_name}",
                                   content, count=1, flags=re.MULTILINE)
              elif re.search(r"^patches:", content, re.MULTILINE):
                  raise SystemExit("unsupported existing GitOps patches format")
              else:
                  content = content.rstrip() + f"\npatches:\n  - path: {patch_name}\n"
          path.write_text(content, encoding="utf-8")
          PY
          git config user.name any2api-ci
          git config user.email any2api-ci@users.noreply.github.com
          git add any2api/oracle/kustomization.yaml any2api/oracle/server-database-affinity.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deploy(any2api): ${IMAGE_SUFFIX}"
          git push origin main
