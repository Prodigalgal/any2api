apiVersion: apps/v1
kind: Deployment
metadata:
  name: any2api-automation
spec:
  template:
    spec:
      containers:
        - name: automation
          env:
            - name: ANY2API_AUTOMATION_BROWSER_PROCESS_CAPACITY
              value: "4"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              ephemeral-storage: 512Mi
            limits:
              cpu: "2"
              memory: 6Gi
              ephemeral-storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: any2api-automation-arena
spec:
  template:
    spec:
      containers:
        - name: automation-arena
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
              ephemeral-storage: 512Mi
            limits:
              cpu: "1.5"
              memory: 6Gi
              ephemeral-storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: any2api-automation-deepseek
spec:
  template:
    spec:
      containers:
        - name: automation-deepseek
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 512Mi
            limits:
              cpu: "1.5"
              memory: 3584Mi
              ephemeral-storage: 3Gi
