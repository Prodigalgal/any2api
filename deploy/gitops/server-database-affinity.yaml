apiVersion: apps/v1
kind: Deployment
metadata:
  name: any2api-server
spec:
  template:
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: any2api-postgres
                topologyKey: kubernetes.io/hostname
