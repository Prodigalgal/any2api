server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: any2api-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/any2api}
    username: ${DATABASE_USERNAME:any2api}
    password: ${DATABASE_PASSWORD:any2api}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          json_format_mapper: jackson3
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: any2api-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

any2api:
  model-runtime:
    max-concurrent-requests: ${ANY2API_MODEL_MAX_CONCURRENCY:32}
    max-queue-wait: ${ANY2API_MODEL_MAX_QUEUE_WAIT:2s}
    circuit-sliding-window: ${ANY2API_MODEL_CIRCUIT_WINDOW:20}
    circuit-minimum-calls: ${ANY2API_MODEL_CIRCUIT_MIN_CALLS:5}
    circuit-failure-rate-threshold: ${ANY2API_MODEL_CIRCUIT_FAILURE_RATE:60}
    circuit-open-duration: ${ANY2API_MODEL_CIRCUIT_OPEN_DURATION:30s}
    health-window: ${ANY2API_MODEL_HEALTH_WINDOW:24h}
    probe-freshness: ${ANY2API_MODEL_PROBE_FRESHNESS:30m}
    scheduled-probe-batch-size: ${ANY2API_MODEL_PROBE_BATCH_SIZE:5}
    ready-success-rate-threshold: ${ANY2API_MODEL_READY_SUCCESS_RATE:90}
    ready-p95-threshold: ${ANY2API_MODEL_READY_P95:60s}
  observability:
    operation-retention: ${ANY2API_OBSERVABILITY_OPERATION_RETENTION:30d}
    usage-retention: ${ANY2API_OBSERVABILITY_USAGE_RETENTION:90d}
    cleanup-interval: ${ANY2API_OBSERVABILITY_CLEANUP_INTERVAL:1h}
    cleanup-initial-delay: ${ANY2API_OBSERVABILITY_CLEANUP_INITIAL_DELAY:10m}
  cache:
    api-key:
      local-ttl: ${ANY2API_CACHE_API_KEY_L1_TTL:30s}
      redis-ttl: ${ANY2API_CACHE_API_KEY_L2_TTL:5m}
      maximum-entries: ${ANY2API_CACHE_API_KEY_MAX_ENTRIES:10000}
    model-catalog:
      local-ttl: ${ANY2API_CACHE_MODEL_CATALOG_L1_TTL:3s}
      redis-ttl: ${ANY2API_CACHE_MODEL_CATALOG_L2_TTL:20s}
      maximum-entries: ${ANY2API_CACHE_MODEL_CATALOG_MAX_ENTRIES:1000}
  media:
    public-base-url: ${ANY2API_MEDIA_PUBLIC_BASE_URL:}
  proxy-bootstrap:
    directory: ${ANY2API_PROXY_BOOTSTRAP_DIRECTORY:}
    pool-name: ${ANY2API_PROXY_BOOTSTRAP_POOL_NAME:Self-hosted Oracle}
  security:
    public-api-key: ${ANY2API_PUBLIC_API_KEY:}
    admin-username: ${ANY2API_ADMIN_USERNAME:admin}
    admin-password: ${ANY2API_ADMIN_PASSWORD:}
    internal-token: ${ANY2API_INTERNAL_TOKEN:}
    credential-master-key: ${ANY2API_CREDENTIAL_MASTER_KEY:}
    admin-session-secure: ${ANY2API_ADMIN_SESSION_SECURE:false}
    admin-session-ttl-seconds: ${ANY2API_ADMIN_SESSION_TTL_SECONDS:28800}
    login-pow-difficulty: ${ANY2API_LOGIN_POW_DIFFICULTY:18}
  automation:
    base-url: ${AUTOMATION_BASE_URL:http://localhost:8090}
  temp-mail:
    api-base: ${ANY2API_AUTOMATION_MAIL_API_BASE:}
    admin-password: ${ANY2API_AUTOMATION_MAIL_ADMIN_PASSWORD:}
    site-password: ${ANY2API_AUTOMATION_MAIL_SITE_PASSWORD:}
    domains: ${ANY2API_AUTOMATION_MAIL_DOMAINS:${ANY2API_AUTOMATION_MAIL_DOMAIN:}}
    poll-seconds: ${ANY2API_AUTOMATION_MAIL_POLL_SECONDS:4}
    message-timeout-seconds: ${ANY2API_AUTOMATION_MAIL_TIMEOUT_SECONDS:240}
    request-timeout-seconds: ${ANY2API_AUTOMATION_MAIL_REQUEST_TIMEOUT_SECONDS:30}
  provider:
    deepseek:
      base-url: ${ANY2API_PROVIDER_DEEPSEEK_BASE_URL:https://chat.deepseek.com}
      asset-host: ${ANY2API_PROVIDER_DEEPSEEK_ASSET_HOST:fe-static.deepseek.com}
      client-version: ${ANY2API_PROVIDER_DEEPSEEK_CLIENT_VERSION:2.3.0}
      bundle-id: ${ANY2API_PROVIDER_DEEPSEEK_BUNDLE_ID:com.deepseek.chat}
      platform: ${ANY2API_PROVIDER_DEEPSEEK_PLATFORM:web}
      locale: ${ANY2API_PROVIDER_DEEPSEEK_LOCALE:en_US}
      timezone-offset-seconds: ${ANY2API_PROVIDER_DEEPSEEK_TIMEZONE_OFFSET_SECONDS:32400}
    grok:
      base-url: ${ANY2API_PROVIDER_GROK_BASE_URL:https://cli-chat-proxy.grok.com/v1}
      client-version: ${ANY2API_PROVIDER_GROK_CLIENT_VERSION:0.2.112}
      token-auth: ${ANY2API_PROVIDER_GROK_TOKEN_AUTH:xai-grok-cli}
      client-identifier: ${ANY2API_PROVIDER_GROK_CLIENT_IDENTIFIER:grok-shell}
    grok-web:
      base-url: ${ANY2API_PROVIDER_GROK_WEB_BASE_URL:https://grok.com}
      accounts-base-url: ${ANY2API_PROVIDER_GROK_WEB_ACCOUNTS_BASE_URL:https://accounts.x.ai}
      assets-base-url: ${ANY2API_PROVIDER_GROK_WEB_ASSETS_BASE_URL:https://assets.grok.com}
      image-asset-origins: ${ANY2API_PROVIDER_GROK_WEB_IMAGE_ASSET_ORIGINS:https://assets.grok.com,https://imagine-public.x.ai,https://imgen.x.ai}
    mimo:
      base-url: ${ANY2API_PROVIDER_MIMO_BASE_URL:https://aistudio.xiaomimimo.com}
      web-output-token-ceiling: ${ANY2API_PROVIDER_MIMO_WEB_OUTPUT_TOKEN_CEILING:65536}
    qwen:
      base-url: ${ANY2API_PROVIDER_QWEN_BASE_URL:https://chat.qwen.ai}
      source: ${ANY2API_PROVIDER_QWEN_SOURCE:web}
      request-version: ${ANY2API_PROVIDER_QWEN_REQUEST_VERSION:2.1}
      max-upload-bytes: ${ANY2API_PROVIDER_QWEN_MAX_UPLOAD_BYTES:20971520}
      model-probe-timeout: ${ANY2API_PROVIDER_QWEN_MODEL_PROBE_TIMEOUT:240s}
    glm:
      base-url: ${ANY2API_PROVIDER_GLM_BASE_URL:https://chat.z.ai}
    longcat:
      base-url: ${ANY2API_PROVIDER_LONGCAT_BASE_URL:https://longcat.chat}
      app-key: ${ANY2API_PROVIDER_LONGCAT_APP_KEY:fe_com.sankuai.friday.fe.longcat}
      requested-with: ${ANY2API_PROVIDER_LONGCAT_REQUESTED_WITH:XMLHttpRequest}
      model-probe-timeout: ${ANY2API_PROVIDER_LONGCAT_MODEL_PROBE_TIMEOUT:240s}
    minmax:
      base-url: ${ANY2API_PROVIDER_MINMAX_BASE_URL:https://agent.minimax.io}
      stream-base-url: ${ANY2API_PROVIDER_MINMAX_STREAM_BASE_URL:https://agent-stream.minimax.io}
      signature-salt: ${ANY2API_PROVIDER_MINMAX_SIGNATURE_SALT:I*7Cf%WZ#S&%1RlZJ&C2}
      yy-salt: ${ANY2API_PROVIDER_MINMAX_YY_SALT:ooui}
      version-code: ${ANY2API_PROVIDER_MINMAX_VERSION_CODE:22201}
      profile-asset-hosts: ${ANY2API_PROVIDER_MINMAX_PROFILE_ASSET_HOSTS:cdn.hailuoai.com}
      max-upload-bytes: ${ANY2API_PROVIDER_MINMAX_MAX_UPLOAD_BYTES:20971520}
