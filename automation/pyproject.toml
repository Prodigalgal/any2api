[project]
name = "any2api-automation"
version = "0.1.0"
description = "Shared browser, registration, captcha, proxy, and mail automation for Any2API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "camoufox[geoip]==0.5.4",
  "captcha-recognizer>=1.0.0",
  "ddddocr>=1.6.0",
  "fastapi==0.140.0",
  "httpx>=0.28.0",
  "numpy>=2.0.0,<3",
  "onnxruntime>=1.22.0",
  "opencv-python-headless>=4.10.0,<5",
  "patchright>=1.61.0",
  "pillow>=11.0.0",
  "pydantic==2.13.4",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "redis>=6.0.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["any2api_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

