services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-any2api}
      POSTGRES_USER: ${POSTGRES_USER:-any2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-any2api} -d ${POSTGRES_DB:-any2api}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  automation:
    build:
      context: ./automation
    environment:
      ANY2API_AUTOMATION_INTERNAL_TOKEN: ${ANY2API_INTERNAL_TOKEN:?ANY2API_INTERNAL_TOKEN is required}
      ANY2API_PUBLIC_API_KEY: ${ANY2API_PUBLIC_API_KEY:?ANY2API_PUBLIC_API_KEY is required}
      ANY2API_AUTOMATION_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      ANY2API_AUTOMATION_JAVA_BASE_URL: http://server:8080
      ANY2API_AUTOMATION_MAIL_API_BASE: ${ANY2API_AUTOMATION_MAIL_API_BASE:?ANY2API_AUTOMATION_MAIL_API_BASE is required}
      ANY2API_AUTOMATION_MAIL_ADMIN_PASSWORD: ${ANY2API_AUTOMATION_MAIL_ADMIN_PASSWORD:?ANY2API_AUTOMATION_MAIL_ADMIN_PASSWORD is required}
      ANY2API_AUTOMATION_MAIL_SITE_PASSWORD: ${ANY2API_AUTOMATION_MAIL_SITE_PASSWORD:-}
      ANY2API_AUTOMATION_MAIL_DOMAIN: ${ANY2API_AUTOMATION_MAIL_DOMAIN:-}
      ANY2API_AUTOMATION_REGISTRATION_PROXY_URL: ${ANY2API_AUTOMATION_REGISTRATION_PROXY_URL:-}
      ANY2API_AUTOMATION_DYNAMIC_PROXY_SUBSCRIPTION_URL: ${ANY2API_AUTOMATION_DYNAMIC_PROXY_SUBSCRIPTION_URL:-}
      ANY2API_AUTOMATION_REGISTRATION_USE_DYNAMIC_PROXY: ${ANY2API_AUTOMATION_REGISTRATION_USE_DYNAMIC_PROXY:-true}
      ANY2API_AUTOMATION_MINMAX_REQUIRE_DYNAMIC_PROXY: ${ANY2API_AUTOMATION_MINMAX_REQUIRE_DYNAMIC_PROXY:-true}
      ANY2API_AUTOMATION_REGISTRATION_HEADLESS: ${ANY2API_AUTOMATION_REGISTRATION_HEADLESS:-true}
      ANY2API_AUTOMATION_CAPTCHA_AI_ENABLED: ${ANY2API_AUTOMATION_CAPTCHA_AI_ENABLED:-false}
      ANY2API_AUTOMATION_CAPTCHA_AI_API_BASE: ${ANY2API_AUTOMATION_CAPTCHA_AI_API_BASE:-}
      ANY2API_AUTOMATION_CAPTCHA_AI_API_KEY: ${ANY2API_AUTOMATION_CAPTCHA_AI_API_KEY:-}
      ANY2API_AUTOMATION_CAPTCHA_AI_MODEL: ${ANY2API_AUTOMATION_CAPTCHA_AI_MODEL:-}
      ANY2API_AUTOMATION_CAPTCHA_AI_TIMEOUT_SECONDS: ${ANY2API_AUTOMATION_CAPTCHA_AI_TIMEOUT_SECONDS:-90}
      ANY2API_AUTOMATION_CAPTCHA_DIAGNOSTICS_DIR: ${ANY2API_AUTOMATION_CAPTCHA_DIAGNOSTICS_DIR:-}
      ANY2API_AUTOMATION_CAPTCHA_DIAGNOSTICS_MAX_FILES: ${ANY2API_AUTOMATION_CAPTCHA_DIAGNOSTICS_MAX_FILES:-200}
      ANY2API_AUTOMATION_BROWSER_TRANSPORT_ALLOWED_ORIGINS: ${ANY2API_AUTOMATION_BROWSER_TRANSPORT_ALLOWED_ORIGINS:-https://grok.com,https://assets.grok.com,https://imagine-public.x.ai,https://imgen.x.ai,https://accounts.x.ai,https://console.x.ai,https://chat.z.ai,https://chat.deepseek.com,https://fe-static.deepseek.com}
      ANY2API_AUTOMATION_BROWSER_CLEARANCE_TIMEOUT_SECONDS: ${ANY2API_AUTOMATION_BROWSER_CLEARANCE_TIMEOUT_SECONDS:-120}
      ANY2API_AUTOMATION_BROWSER_CLEARANCE_ATTEMPTS: ${ANY2API_AUTOMATION_BROWSER_CLEARANCE_ATTEMPTS:-2}
      ANY2API_AUTOMATION_GROK_TURNSTILE_USE_FLOW_PROXY: ${ANY2API_AUTOMATION_GROK_TURNSTILE_USE_FLOW_PROXY:-true}
      ANY2API_AUTOMATION_DEEPSEEK_BASE_URL: ${ANY2API_AUTOMATION_DEEPSEEK_BASE_URL:-https://chat.deepseek.com}
      ANY2API_AUTOMATION_DEEPSEEK_REGISTRATION_BROWSER_ATTEMPTS: ${ANY2API_AUTOMATION_DEEPSEEK_REGISTRATION_BROWSER_ATTEMPTS:-4}
      ANY2API_AUTOMATION_MIMO_REGISTRATION_PUBLIC_KEY_DER: ${ANY2API_AUTOMATION_MIMO_REGISTRATION_PUBLIC_KEY_DER:-}
    ports:
      - "8090:8090"
    depends_on:
      redis:
        condition: service_healthy

  server:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-any2api}
      DATABASE_USERNAME: ${POSTGRES_USER:-any2api}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      AUTOMATION_BASE_URL: http://automation:8090
      ANY2API_PUBLIC_API_KEY: ${ANY2API_PUBLIC_API_KEY:?ANY2API_PUBLIC_API_KEY is required}
      ANY2API_ADMIN_USERNAME: ${ANY2API_ADMIN_USERNAME:-admin}
      ANY2API_ADMIN_PASSWORD: ${ANY2API_ADMIN_PASSWORD:?ANY2API_ADMIN_PASSWORD is required}
      ANY2API_INTERNAL_TOKEN: ${ANY2API_INTERNAL_TOKEN:?ANY2API_INTERNAL_TOKEN is required}
      ANY2API_CREDENTIAL_MASTER_KEY: ${ANY2API_CREDENTIAL_MASTER_KEY:?ANY2API_CREDENTIAL_MASTER_KEY is required}
      ANY2API_AUTOMATION_MAIL_API_BASE: ${ANY2API_AUTOMATION_MAIL_API_BASE:?ANY2API_AUTOMATION_MAIL_API_BASE is required}
      ANY2API_AUTOMATION_MAIL_ADMIN_PASSWORD: ${ANY2API_AUTOMATION_MAIL_ADMIN_PASSWORD:?ANY2API_AUTOMATION_MAIL_ADMIN_PASSWORD is required}
      ANY2API_AUTOMATION_MAIL_SITE_PASSWORD: ${ANY2API_AUTOMATION_MAIL_SITE_PASSWORD:-}
      ANY2API_AUTOMATION_MAIL_DOMAIN: ${ANY2API_AUTOMATION_MAIL_DOMAIN:-}
      ANY2API_AUTOMATION_MAIL_DOMAINS: ${ANY2API_AUTOMATION_MAIL_DOMAINS:-}
      ANY2API_AUTOMATION_MAIL_POLL_SECONDS: ${ANY2API_AUTOMATION_MAIL_POLL_SECONDS:-4}
      ANY2API_AUTOMATION_MAIL_TIMEOUT_SECONDS: ${ANY2API_AUTOMATION_MAIL_TIMEOUT_SECONDS:-240}
      ANY2API_AUTOMATION_MAIL_REQUEST_TIMEOUT_SECONDS: ${ANY2API_AUTOMATION_MAIL_REQUEST_TIMEOUT_SECONDS:-30}
      ANY2API_MEDIA_PUBLIC_BASE_URL: ${ANY2API_MEDIA_PUBLIC_BASE_URL:-}
      ANY2API_PROXY_BOOTSTRAP_DIRECTORY: ${ANY2API_PROXY_BOOTSTRAP_DIRECTORY:-}
      ANY2API_PROXY_BOOTSTRAP_POOL_NAME: ${ANY2API_PROXY_BOOTSTRAP_POOL_NAME:-Self-hosted Oracle}
      ANY2API_PROVIDER_GROK_BASE_URL: ${ANY2API_PROVIDER_GROK_BASE_URL:-https://cli-chat-proxy.grok.com/v1}
      ANY2API_PROVIDER_MIMO_BASE_URL: ${ANY2API_PROVIDER_MIMO_BASE_URL:-https://aistudio.xiaomimimo.com}
      ANY2API_PROVIDER_QWEN_BASE_URL: ${ANY2API_PROVIDER_QWEN_BASE_URL:-https://chat.qwen.ai}
      ANY2API_PROVIDER_GLM_BASE_URL: ${ANY2API_PROVIDER_GLM_BASE_URL:-https://chat.z.ai}
      ANY2API_PROVIDER_GLM_FRONTEND_VERSION: ${ANY2API_PROVIDER_GLM_FRONTEND_VERSION:-1.1.79}
      ANY2API_PROVIDER_GLM_SIGNATURE_KEY: ${ANY2API_PROVIDER_GLM_SIGNATURE_KEY:-key-@@@@)))()((9))-xxxx&&&%%%%%}
      ANY2API_PROVIDER_DEEPSEEK_BASE_URL: ${ANY2API_PROVIDER_DEEPSEEK_BASE_URL:-https://chat.deepseek.com}
      ANY2API_PROVIDER_LONGCAT_BASE_URL: ${ANY2API_PROVIDER_LONGCAT_BASE_URL:-https://longcat.chat}
      ANY2API_PROVIDER_MINMAX_BASE_URL: ${ANY2API_PROVIDER_MINMAX_BASE_URL:-https://agent.minimax.io}
      ANY2API_PROVIDER_MINMAX_STREAM_BASE_URL: ${ANY2API_PROVIDER_MINMAX_STREAM_BASE_URL:-https://agent-stream.minimax.io}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      automation:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        ANY2API_BACKEND_URL: http://server:8080
    environment:
      ANY2API_BACKEND_URL: http://server:8080
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres-data:
  redis-data:
